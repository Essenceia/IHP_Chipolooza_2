meta:
  version: 3
  flow: Chip
  substituting_steps:

    #Magic.*: null
    #Netgen.*: null

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable magic DRC
    # Magic.DRC: null
    #Checker.MagicDRC: null

    # Disable KLayout antenna check
    KLayout.Antenna: null
    Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null
    
    # Save time
    OpenROAD.IRDropReport: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/analog_dummy.v
- dir::../src/chip_core.sv
- dir::../src/spi.v

VERILOG_DEFINES: [FUNCTIONAL]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Specify the pad instances for the padring
# Signal, AVDD, txp, txn, VSS, clkp, clkn, vss
PAD_SOUTH: [
    "analogs\\[0\\].analog_pad",
    "analogs\\[1\\].analog_pad",
    "analogs\\[3\\].analog_pad",

    "vdda\\[0\\].vdda_pad",
    "tx_p_pad",   
    "tx_n_pad", 
    "vssa\\[0\\].vssa_pad",
    clk_p_pad,
    clk_n_pad,
    "vssa\\[1\\].vssa_pad"

]

PAD_EAST: [
    "analogs\\[4\\].analog_pad",
    "analogs\\[5\\].analog_pad",
    "analogs\\[6\\].analog_pad",
    "analogs\\[7\\].analog_pad",

    "iovdda\\[0\\].iovdda_pad",
    "iovssa\\[0\\].iovssa_pad",

    "vssa\\[2\\].vssa_pad",
    rx_n_pad,
    rx_p_pad, 
    "vssa\\[3\\].vssa_pad"
]
# TODO: replace IO analog power pads with IO digital power
PAD_NORTH: [
    "edge_info\\[0\\].edge_info_pad",
    "edge_info\\[1\\].edge_info_pad",
    "edge_info\\[2\\].edge_info_pad",
    "edge_info\\[3\\].edge_info_pad",

    iovddd_pad,
    iovssd_pad,

    "edge_info\\[4\\].edge_info_pad",
    "edge_info\\[5\\].edge_info_pad",
    "edge_info\\[6\\].edge_info_pad",
    "edge_info\\[7\\].edge_info_pad"
]
# TODO: replace analog power pads with digital power
PAD_WEST: [
    unused_pad, 
    test_mode_pad,
    rst_n_pad,     
    clk_mon_pad, 

    vddd_pad,
    vssd_pad,
    
    spi_so_pad,
    spi_si_pad,
    spi_ncs_pad,
    spi_sclk_pad,
]

PAD_CFG: dir::pad_cfg.tcl
# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Clock
CLOCK_NET: m_analog/digital_clk_o
CLOCK_PORT: m_analog/digital_clk_o

CLOCK_PERIOD: 20

# Floorplanning
FP_SIZING: absolute
# for the sealring on all sides
DIE_AREA: [0, 0, 1580, 1580]
CORE_AREA: [365, 365, 1215, 1215]

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 10
GRT_ALLOW_CONGESTION: true

# PDN
PDN_CORE_RING: True

# Override bondpad name
PAD_BONDPAD_NAME: bondpad_70x70_5L

# Bondpad is not yet included in the PDK
EXTRA_GDS:
- dir::../ip/bondpad_70x70/gds/bondpad_70x70_5L.gds
- dir::../ip/sg13cmos5l_ocd_Split2000/gds/sg13cmos5l_ocd_Split2000.gds

EXTRA_LEFS:
- dir::../ip/bondpad_70x70/lef/bondpad_70x70_5L.lef
- dir::../ip/sg13cmos5l_ocd_Split2000/lef/sg13cmos5l_ocd_Split2000.lef

EXTRA_VERILOG_MODELS:
- dir::../ip/sg13cmos5l_ocd_Split2000/vh/sg13cmos5l_ocd_Split2000.v


IGNORE_DISCONNECTED_MODULES:
- bondpad_70x70_5L

# Power / ground nets
# TODO: add back digital power
VDD_NETS:
- VDDA
- VDDD
GND_NETS:
- VSSA
- VSSD
#
PDN_CFG: dir::pdn_cfg.tcl

# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 15
PDN_CORE_RING_HWIDTH: 15
# Ensure minimum spacing for long metals
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5

PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

